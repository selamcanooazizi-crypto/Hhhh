name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Zip'i ac
        run: unzip -q pvp-visuals-1.20.1.zip
      - name: Derle
        working-directory: pvp
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pvpvisuals-jar
          path: pvp/build/libs/*.jar
